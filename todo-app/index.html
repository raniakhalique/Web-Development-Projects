<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daylist — To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120f1c;
    --bg-2:#0d0b16;
    --surface:#1c1830;
    --surface-raised:#241f3d;
    --accent:#9b6bff;
    --accent-2:#56d6ff;
    --text:#f1edff;
    --text-muted:#a79fc4;
    --success:#6ee7b7;
    --danger:#ff6f8f;
    --shadow-dark: rgba(4,2,10,0.55);
    --shadow-light: rgba(255,255,255,0.05);
    --radius: 20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(circle at 15% 10%, #221a3d 0%, var(--bg) 45%), var(--bg-2);
    font-family:'Sora', sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
    position:relative;
    overflow-x:hidden;
  }
  .orb{
    position:fixed;
    border-radius:50%;
    filter: blur(60px);
    opacity:0.35;
    pointer-events:none;
    z-index:0;
  }
  .orb.one{ width:340px; height:340px; background:var(--accent); top:-100px; left:-80px; }
  .orb.two{ width:260px; height:260px; background:var(--accent-2); bottom:-60px; right:-60px; opacity:0.22;}
  .orb.three{ width:160px; height:160px; background:#5a4bff; top:40%; right:8%; opacity:0.18; }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
  }

  .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:28px;
  }
  .top h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.6rem;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .top .date{
    color:var(--text-muted);
    font-size:0.85rem;
    margin-top:6px;
  }
  .count{
    text-align:right;
  }
  .count .num{
    font-family:'Fraunces', serif;
    font-size:1.6rem;
    color:var(--accent-2);
  }
  .count .label{
    font-size:0.7rem;
    color:var(--text-muted);
    text-transform:lowercase;
  }

  .composer{
    background:var(--surface);
    border-radius:var(--radius);
    padding:8px 8px 8px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:
      8px 8px 18px var(--shadow-dark),
      -6px -6px 16px var(--shadow-light);
    margin-bottom:24px;
  }
  .composer input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'Sora', sans-serif;
    font-size:0.95rem;
    padding:14px 0;
  }
  .composer input::placeholder{ color:var(--text-muted); }
  .composer button{
    width:44px; height:44px;
    border-radius:14px;
    border:none;
    background: linear-gradient(145deg, #a67bff, #8250f0);
    color:#fff;
    font-size:1.3rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 4px 4px 10px var(--shadow-dark), -2px -2px 6px rgba(255,255,255,0.06);
    transition: transform 0.15s ease;
    flex-shrink:0;
  }
  .composer button:active{ transform: scale(0.92); }

  .filters{
    display:flex;
    gap:6px;
    margin-bottom:18px;
  }
  .filters button{
    flex:1;
    padding:9px 0;
    border-radius:12px;
    border:none;
    background:transparent;
    color:var(--text-muted);
    font-family:'Sora', sans-serif;
    font-size:0.78rem;
    font-weight:600;
    cursor:pointer;
    transition: all 0.2s ease;
  }
  .filters button.active{
    background:var(--surface-raised);
    color:var(--accent-2);
    box-shadow: inset 3px 3px 8px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .task{
    background:var(--surface);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow: 6px 6px 14px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    animation: rise 0.28s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .task.leaving{
    animation: leave 0.22s ease forwards;
  }
  @keyframes leave{
    to{ opacity:0; transform: translateX(14px) scale(0.98); }
  }
  .check{
    width:22px; height:22px;
    border-radius:50%;
    border:2px solid var(--accent);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.2s ease;
  }
  .check.done{
    background: linear-gradient(145deg, var(--accent-2), var(--accent));
    border-color:transparent;
  }
  .check.done::after{
    content:'';
    width:9px; height:5px;
    border-left:2px solid #0d0b16;
    border-bottom:2px solid #0d0b16;
    transform: rotate(-45deg) translateY(-1px);
  }
  .task p{
    flex:1;
    font-size:0.92rem;
    word-break:break-word;
  }
  .task.done p{
    color:var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--danger);
  }
  .del{
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-size:1rem;
    cursor:pointer;
    opacity:0.6;
    transition: opacity 0.15s, color 0.15s;
    flex-shrink:0;
  }
  .del:hover{ opacity:1; color:var(--danger); }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--text-muted);
  }
  .empty .glyph{
    font-family:'Fraunces', serif;
    font-size:2.2rem;
    color:var(--accent);
    margin-bottom:8px;
    display:block;
  }
  .empty p{ font-size:0.85rem; }

  @media (prefers-reduced-motion: reduce){
    .task, .task.leaving{ animation:none; }
  }
</style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>

  <div class="app">
    <div class="top">
      <div>
        <h1>Today</h1>
        <div class="date" id="today-date"></div>
      </div>
      <div class="count">
        <div class="num" id="remaining-count">0</div>
        <div class="label">remaining</div>
      </div>
    </div>

    <div class="composer">
      <input id="task-input" type="text" placeholder="What needs doing?" maxlength="120">
      <button id="add-btn" aria-label="Add task">+</button>
    </div>

    <div class="filters">
      <button class="active" data-filter="all">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="done">Done</button>
    </div>

    <div class="list" id="list"></div>
    <div class="empty" id="empty-state" style="display:none;">
      <span class="glyph">✦</span>
      <p>Nothing here — add your first task above.</p>
    </div>
  </div>

<script>
  let tasks = [];
  let idCounter = 0;
  let filter = 'all';

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty-state');
  const input = document.getElementById('task-input');
  const remainingEl = document.getElementById('remaining-count');

  document.getElementById('today-date').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

  function addTask(){
    const val = input.value.trim();
    if(!val) return;
    tasks.push({ id: idCounter++, text: val, done: false });
    input.value = '';
    render();
  }

  function toggleTask(id){
    const t = tasks.find(t => t.id === id);
    if(t) t.done = !t.done;
    render();
  }

  function removeTask(id){
    const el = document.querySelector(`[data-id="${id}"]`);
    if(el){
      el.classList.add('leaving');
      setTimeout(() => {
        tasks = tasks.filter(t => t.id !== id);
        render();
      }, 200);
    } else {
      tasks = tasks.filter(t => t.id !== id);
      render();
    }
  }

  function render(){
    const visible = tasks.filter(t => filter === 'all' ? true : filter === 'active' ? !t.done : t.done);
    listEl.innerHTML = '';
    visible.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task' + (t.done ? ' done' : '');
      row.dataset.id = t.id;
      row.innerHTML = `
        <div class="check ${t.done ? 'done' : ''}"></div>
        <p></p>
        <button class="del">✕</button>
      `;
      row.querySelector('p').textContent = t.text;
      row.querySelector('.check').addEventListener('click', () => toggleTask(t.id));
      row.querySelector('.del').addEventListener('click', () => removeTask(t.id));
      listEl.appendChild(row);
    });
    emptyEl.style.display = visible.length ? 'none' : 'block';
    remainingEl.textContent = tasks.filter(t => !t.done).length;
  }

  document.getElementById('add-btn').addEventListener('click', addTask);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('.filters button.active').classList.remove('active');
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
